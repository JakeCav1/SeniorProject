name: Rust checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --locked --all-targets -- -D warnings
      - run: cargo +stable test --locked
      - name: Test Linux user installation and service unit
        if: runner.os == 'Linux'
        run: python3 scripts/test-install-linux.py target/debug/chompedr
      - name: Test real SSH authentication logs on Linux
        if: runner.os == 'Linux'
        run: sudo python3 scripts/live-ssh-test.py target/debug/chompedr
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build native release executable
        run: cargo +stable build --release --locked
      - name: Package and smoke-test extracted build
        run: python scripts/package.py
      - name: Upload tested snapshot package
        uses: actions/upload-artifact@v4
        with:
          name: chomp-edr-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
