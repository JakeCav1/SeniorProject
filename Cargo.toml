[package]
name = "chomp-edr"
version = "0.1.0"
edition = "2021"
description = "Lightweight, configurable event detection for Chomp EDR"
publish = false
default-run = "chompedr"

[lib]
name = "chomp_edr"

[[bin]]
name = "chomp"
path = "src/main.rs"

[[bin]]
name = "chompedr"
path = "src/bin/chompedr.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
